[project]
name = "mcca-genomespy"
version = "0.1.0"
description = "Download and wrangle MCCA data for a local GenomeSpy demo."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.3.0",
    "openpyxl>=3.1.5",
    "polars>=1.36.0",
    "pyarrow>=22.0.0",
    "rangehttpserver>=1.4.0",
    "zarr>=3.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[project.scripts]
mcca-download = "mcca_genomespy.download:main"
mcca-wrangle = "mcca_genomespy.wrangle:main"
mcca-gencode-genes = "mcca_genomespy.gene_annotations:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
